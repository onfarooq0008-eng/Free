name: Kasm Firefox

on:
  workflow_dispatch:

jobs:
  firefox:
    runs-on: ubuntu-latest

    services:
      kasm-firefox:
        image: kasmweb/firefox
        env:
          VNC_PW: github
        ports:
          - 6901:6901
        options: >-
          --shm-size=1g

    steps:
      - name: Wait for Kasm Firefox to start
        run: |
          for i in {1..30}; do
            if curl -k -I https://localhost:6901 >/dev/null 2>&1; then
              echo "Kasm Firefox is up"
              exit 0
            fi
            sleep 5
          done
          echo "Kasm Firefox did not start"
          exit 1

      - name: Show service info
        run: |
          echo "Open the runner logs to confirm the container started."
          docker ps
